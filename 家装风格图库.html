<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>家装风格图库 · 侯哥智改</title>
<style>
:root{--navy:#16243f;--navy2:#22365c;--orange:#e8772e;--paper:#f7f5f1;--line:#e6e0d6;--ink:#2b2b2b;--mut:#7a7468}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
/* 顶栏 */
.top{position:sticky;top:0;z-index:30;background:rgba(247,245,241,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:60px}
.logo{height:34px;width:34px;border-radius:8px;object-fit:contain;background:#fff;padding:3px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.brand{font-weight:800;font-size:18px;letter-spacing:.5px;color:var(--navy)}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--mut);letter-spacing:2px}
.top .spacer{flex:1}
.btn{background:var(--orange);color:#fff;font-weight:700;padding:9px 16px;border-radius:999px;font-size:14px;box-shadow:0 3px 10px rgba(232,119,46,.35)}
/* 头图 */
.hero{position:relative;margin-top:18px;border-radius:18px;overflow:hidden;min-height:240px;display:flex;align-items:flex-end;color:#fff}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,36,63,.15),rgba(22,36,63,.82))}
.hero .ht{position:relative;z-index:2;padding:26px 24px}
.hero h1{font-size:26px;letter-spacing:1px;margin-bottom:6px}
.hero p{font-size:13px;opacity:.92;max-width:640px;line-height:1.7}
.tag-hot{display:inline-block;background:var(--orange);font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;margin-bottom:10px}
/* 风格介绍卡 */
.stylecard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin:18px 0;display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
.stylecard h2{font-size:20px;color:var(--navy);margin-bottom:4px}
.stylecard .en{font-size:12px;letter-spacing:3px;color:var(--orange);font-weight:700;margin-bottom:12px}
.stylecard .desc{font-size:14px;line-height:1.85;color:#444}
.chips2{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips2 span{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12px;color:#555}
.sc-meta{font-size:13px;line-height:1.9;color:#444}
.sc-meta b{color:var(--navy)}
/* 筛选条 */
.filters{position:sticky;top:60px;z-index:20;background:rgba(247,245,241,.96);padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:6px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tab{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:14px;font-weight:600;color:#555;cursor:pointer;transition:.15s}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.subtabs{display:flex;gap:7px;flex-wrap:wrap}
.subtab{background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:13px;color:#666;cursor:pointer;transition:.15s}
.subtab.on{background:var(--orange);color:#fff;border-color:var(--orange)}
/* 网格 */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:14px 0 30px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:.18s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(22,36,63,.14)}
.card .ph{position:relative;aspect-ratio:4/3;overflow:hidden;background:#eee}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:.3s}
.card:hover .ph img{transform:scale(1.05)}
.card .badge{position:absolute;left:8px;top:8px;background:rgba(22,36,63,.78);color:#fff;font-size:11px;padding:3px 9px;border-radius:999px}
.card .cap{padding:9px 11px;font-size:12.5px;color:#444;line-height:1.5}
.card .cap b{color:var(--navy)}
/* 灯箱 */
.lb{position:fixed;inset:0;z-index:100;background:rgba(10,14,22,.94);display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px}
.lb.show{display:flex}
.lb img{max-width:92vw;max-height:80vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.lb .lc{color:#eee;margin-top:14px;font-size:14px;text-align:center;max-width:90vw}
.lb .lc b{color:var(--orange)}
.lb .cnt{color:#9aa;font-size:12px;margin-top:6px}
.lb .close{position:absolute;top:18px;right:22px;color:#fff;font-size:32px;cursor:pointer;line-height:1}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:40px;cursor:pointer;padding:10px 16px;user-select:none;opacity:.85}
.lb .nav:hover{opacity:1}
.lb .prev{left:6px}.lb .next{right:6px}
/* 底部 CTA */
.cta{background:var(--navy);color:#fff;border-radius:18px;padding:26px 24px;margin:10px 0 40px;text-align:center}
.cta h3{font-size:19px;margin-bottom:8px}
.cta p{font-size:13.5px;opacity:.9;line-height:1.7;margin-bottom:14px}
.cta .btn{display:inline-block}
.foot{text-align:center;color:var(--mut);font-size:12px;padding:0 0 30px}
@media(max-width:760px){
  .stylecard{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .hero{min-height:200px}.hero h1{font-size:21px}
  .top .wrap{height:54px}.brand{font-size:16px}
  .btn{padding:8px 13px;font-size:13px}
  .tabs,.subtabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .tabs::-webkit-scrollbar,.subtabs::-webkit-scrollbar{display:none}
}
@media(max-width:420px){.grid{gap:8px}.card .cap{font-size:11.5px}}
</style>
</head>

];

let curStyle = "老钱风";   // 默认进入老钱风
let curCat = "全部";
let view = [];            // 当前筛选后的列表
let lbIdx = 0;

const $ = s => document.querySelector(s);
const grid = $("#grid"), catTabs = $("#catTabs"), styleCard = $("#styleCard");

// 初始化封面
(function(){
  const cov = PHOTOS.find(p=>p.cover) || PHOTOS[0];
  $("#heroImg").src = cov.src;
})();

function catsForStyle(){
  const pool = PHOTOS;
  const set=[]; pool.forEach(p=>{if(!set.includes(p.cat))set.push(p.cat);});
  // 固定顺序
  const order=["客厅","餐厅","厨房","卧室","卫浴","玄关","书房","过道"];
  return ["全部",...order.filter(c=>set.includes(c))];
}

function renderCatTabs(){
  catTabs.innerHTML="";
  catsForStyle().forEach(c=>{
    const b=document.createElement("div");
    b.className="subtab"+(c===curCat?" on":"");
    b.textContent=c==="全部"?"全部空间":c;
    b.onclick=()=>{curCat=c;renderCatTabs();renderGrid();};
    catTabs.appendChild(b);
  });
}

function renderCard(){
  if(curStyle==="全部"||!STYLES[curStyle]){styleCard.style.display="none";return;}
  const s=STYLES[curStyle];
  styleCard.style.display="grid";
  styleCard.innerHTML=`
    <div>
      <h2>${curStyle}</h2><div class="en">${s.en}</div>
      <div class="desc">${s.desc}</div>
      <div class="chips2">${s.materials.map(m=>`<span>${m}</span>`).join("")}</div>
    </div>
    <div class="sc-meta">
      <div><b>标志性元素</b></div>
      <div class="chips2">${s.elements.map(e=>`<span>${e}</span>`).join("")}</div>
      <div style="margin-top:12px"><b>适合：</b>${s.suit}</div>
      <div style="margin-top:6px"><b>参考造价：</b>${s.cost}</div>
    </div>`;
}

function renderGrid(){
  view = PHOTOS.filter(p=>curCat==="全部"||p.cat===curCat);
  grid.innerHTML="";
  view.forEach((p,i)=>{
    const c=document.createElement("div");
    c.className="card";
    c.innerHTML=`<div class="ph"><span class="badge">${p.space}</span><img src="${p.src}" alt="${p.cap}"></div>
                 <div class="cap"><b>${p.style}</b> · ${p.cap}</div>`;
    c.onclick=()=>openLb(i);
    grid.appendChild(c);
  });
  if(!view.length) grid.innerHTML='<p style="color:#888;padding:30px">该分类暂无图片，敬请期待更新。</p>';
}

function openLb(i){lbIdx=i;showLb();$("#lb").classList.add("show");}
function closeLb(){$("#lb").classList.remove("show");}
function step(d){lbIdx=(lbIdx+d+view.length)%view.length;showLb();}
function showLb(){
  const p=view[lbIdx];
  $("#lbImg").src=p.src;
  $("#lbCap").innerHTML=`<b>${p.style}</b> · ${p.space} ｜ ${p.cap}`;
  $("#lbCnt").textContent=(lbIdx+1)+" / "+view.length;
}
$("#lb").addEventListener("click",e=>{if(e.target.id==="lb")closeLb();});
document.addEventListener("keydown",e=>{
  if(!$("#lb").classList.contains("show"))return;
  if(e.key==="Escape")closeLb();
  if(e.key==="ArrowLeft")step(-1);
  if(e.key==="ArrowRight")step(1);
});

renderCatTabs();renderCard();renderGrid();
</script>
</body>
</html>
